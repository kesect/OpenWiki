<!doctype html>
<html style="color-scheme:dark">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<style>
@font-face {
font-family: Rubik;
font-style: normal;
font-weight: 300 900;
src: url(rubik.woff2) format(woff2)
}

body {
background-color: #121212;
opacity: 0.9;
padding: 60px;
font-family: Rubik;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
padding: 0;
margin: 0 auto;
}

input {
background-color: #202020;
border: none;
border-radius: 30px;
height: 60px;
width: 100%;
transition: 0.2s ease;
outline: none;
color: lightblue;
font-family: Rubik;
font-size: 2rem;
padding-left: 15px;
margin-bottom: 15px;
box-sizing: border-box
}

input:focus {
background-color: #303030;
border-radius: 15px
}

@media (max-width: 800px) {
body {
align-items: flex-start
}
button {
display: none
}
.main {
width:90% !important;
margin: 0 auto;
margin-top:50px
}
}

input::-webkit-calendar-picker-indicator {
opacity: 0;
z-index: -1
}

footer {
position: fixed;
bottom: 0;
padding-left: 40px;
filter: brightness(0.7);
background-color: #121212;
height:50px;
width:100%;
font-size: 1.1rem;

display: flex;
align-items: center;
}

::selection {
background: #376681
}

* {
user-select: none
}

.random {
padding-left: 30px;
padding-right: 30px;
height: 60px;
width: auto;
border: none;
border-radius: 20px;
font-size: 1.5rem;
font-family: Rubik;
background-color: #4b6675;
color: lightblue;
text-decoration: none;
display: inline-block;
transition: 0.2s ease;
cursor: pointer;
text-align: center;
line-height: 60px
}

.random:hover {
filter: brightness(0.9)
}

.random:active {
filter: brightness(1.05);
border-radius: 28px
}

</style>
</head>
<body>
<footer style="user-select:text">TRANSLATE_1 (uuid)</footer>
<div style="width:700px" class="main">
<center>
<h1 style="font-size:5rem;margin:0;margin-bottom:25px;user-select:text">TRANSLATE_1</h1>
</center>
<form method="POST">
<input type="text" autofocus required list="suggestions" name="q" id="search" autocomplete="off">
<center>
<button class="random" style="margin-right:10px" type="submit">TRANSLATE_3</button>
<a draggable="false" href="search" class="random">TRANSLATE_4</a>
</center>
</form>
</div>
<div>
</div>
<datalist id="suggestions"></datalist>
<script>
var timer
const datalist = document.getElementById("suggestions")
document.getElementById("search").oninput = function(event) {
for (var option of datalist.options) {
if (option.value == event.target.value) {
datalist.innerHTML = ""
return
}
}
if (event.target.value == "") {
datalist.innerHTML = ""
return
}
clearTimeout(timer)
timer = setTimeout(async function() {
const data = await fetch("search?q=" + encodeURIComponent(event.target.value))
const json = await data.json()
datalist.innerHTML = ""
json.pages.forEach(function(page) {
const opt = document.createElement("option")
opt.value = page.title
if (page.description) {
opt.label = page.description
}
datalist.appendChild(opt)
})
}, 150)
}
</script>
</body>
</html>
